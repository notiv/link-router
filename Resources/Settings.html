<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LinkRouter</title>
  <style>
    :root {
      color-scheme: light;
      --accent: #0a6cf5;
      --accent-hover: #095fd9;
      --text: #1d1d1f;
      --muted: rgba(0, 0, 0, .55);
      --faint: rgba(0, 0, 0, .42);
      --border: rgba(0, 0, 0, .14);
      --sidebar: #f1f1f3;
      --footer: #f7f7f8;
      --control-height: 32px;
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      color: var(--text);
      background: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
      font-size: 13px;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }
    button, input { font: inherit; color: inherit; }
    button { border: 0; -webkit-appearance: none; appearance: none; }
    button:focus-visible, input:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    .app { height: 100%; display: flex; flex-direction: column; background: #fff; }
    .titlebar {
      position: relative;
      flex: 0 0 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #eceded;
      border-bottom: 1px solid var(--border);
      -webkit-app-region: drag;
    }
    .titlebar-title { font-size: 12px; font-weight: 600; }
    .traffic-lights {
      position: absolute;
      top: 0;
      left: 12px;
      height: 38px;
      display: flex;
      align-items: center;
      gap: 7px;
      -webkit-app-region: no-drag;
    }
    .traffic-light {
      width: 12px;
      height: 12px;
      padding: 0;
      border: 1px solid rgba(0, 0, 0, .14);
      border-radius: 50%;
      cursor: default;
    }
    .traffic-light.close { background: #ff5f57; }
    .traffic-light.minimize { background: #febc2e; }
    .traffic-light.zoom { background: #28c840; }
    .workspace { min-height: 0; flex: 1; display: flex; }

    .sidebar {
      width: 214px;
      flex: 0 0 214px;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: var(--sidebar);
      border-right: 1px solid var(--border);
    }
    .rule-list { min-height: 0; flex: 1; overflow: auto; padding: 8px 8px 4px; }
    .sidebar-row {
      width: 100%;
      height: 32px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 9px;
      margin-bottom: 1px;
      border-radius: 6px;
      color: var(--text);
      background: transparent;
      cursor: default;
      text-align: left;
    }
    .sidebar-row:hover:not(.selected) { background: rgba(0, 0, 0, .055); }
    .sidebar-row.selected { color: #fff; background: var(--accent); }
    .row-name {
      min-width: 0;
      flex: 1;
      overflow: hidden;
      font-size: 12.5px;
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .row-destination { flex: none; color: var(--faint); font-size: 11px; white-space: nowrap; }
    .selected .row-destination { color: rgba(255, 255, 255, .84); }

    .sidebar-actions {
      flex: none;
      height: 36px;
      display: flex;
      align-items: center;
      padding: 0 9px;
    }
    .add-rule {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 5px 8px;
      color: var(--muted);
      background: transparent;
      border-radius: 5px;
      cursor: pointer;
    }
    .add-rule:hover { color: var(--text); background: rgba(0, 0, 0, .055); }
    .rule-actions { display: flex; gap: 2px; margin-left: auto; }
    .icon-button {
      width: 24px;
      height: 24px;
      display: grid;
      place-items: center;
      border-radius: 5px;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
    }
    .icon-button:hover:not(:disabled) { color: var(--text); background: rgba(0, 0, 0, .07); }
    .icon-button:disabled { opacity: .28; cursor: default; }
    .everything-else { flex: none; padding: 8px; border-top: 1px solid var(--border); }
    .eyebrow {
      margin: 1px 9px 6px;
      color: rgba(0, 0, 0, .5);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .055em;
      text-transform: uppercase;
    }

    .detail { min-width: 0; flex: 1; overflow: auto; background: #fff; }
    .editor { width: 100%; max-width: 620px; padding: 22px 26px 28px; }
    .editor-group { display: flex; flex-direction: column; gap: 22px; }
    .heading-input, .heading {
      width: 100%;
      padding: 0;
      margin: 0;
      border: 0;
      outline: 0;
      background: transparent;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -.02em;
      line-height: 26px;
    }
    .heading-input { user-select: text; }
    .heading-input:focus-visible { border-radius: 5px; box-shadow: 0 0 0 3px rgba(10, 108, 245, .18); outline: 0; }
    .description { margin-top: 4px; color: var(--muted); font-size: 12.5px; line-height: 18px; }
    .divider { height: 1px; margin-top: 9px; background: rgba(0, 0, 0, .12); }
    .section-title {
      margin-bottom: 9px;
      color: rgba(0, 0, 0, .5);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .055em;
      text-transform: uppercase;
    }
    .domain-list { display: flex; flex-direction: column; gap: 8px; }
    .domain-row { display: flex; align-items: center; gap: 10px; }
    .input-shell {
      min-width: 0;
      height: var(--control-height);
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 0 9px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #fff;
    }
    .domain-shell { flex: 1; }
    .prefix { opacity: .45; font-family: "SF Mono", ui-monospace, Menlo, monospace; font-size: 12.5px; }
    .text-input {
      width: 100%;
      min-width: 0;
      padding: 0;
      border: 0;
      outline: 0;
      background: transparent;
      font-family: "SF Mono", ui-monospace, Menlo, monospace;
      font-size: 13px;
      user-select: text;
    }
    .text-input::placeholder { color: rgba(0, 0, 0, .38); }
    .text-input:focus-visible { outline: 0; }
    .input-shell:focus-within { border-color: rgba(10, 108, 245, .65); box-shadow: 0 0 0 2px rgba(10, 108, 245, .13); }
    .segmented {
      height: var(--control-height);
      display: inline-flex;
      flex: none;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #fff;
    }
    .segment {
      display: flex;
      align-items: center;
      padding: 0 10px;
      color: rgba(0, 0, 0, .58);
      background: transparent;
      border-right: 1px solid rgba(0, 0, 0, .12);
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      cursor: pointer;
    }
    .segment:last-child { border-right: 0; }
    .segment.selected { color: #fff; background: var(--accent); }
    .segment:hover:not(.selected) { background: rgba(0, 0, 0, .045); }
    .remove-domain { width: 22px; padding: 0; color: rgba(0, 0, 0, .4); background: transparent; font-size: 17px; cursor: pointer; }
    .text-button { align-self: flex-start; padding: 2px 0; color: var(--accent); background: transparent; font-size: 13px; font-weight: 500; cursor: pointer; }
    .text-button:hover { color: var(--accent-hover); }
    .destination-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
    .profile-row { display: flex; align-items: center; gap: 8px; }
    .profile-label { color: rgba(0, 0, 0, .58); font-size: 12px; }
    .profile-shell { width: 140px; }
    .private-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 13px;
      padding: 0;
      color: inherit;
      background: transparent;
      text-align: left;
      cursor: pointer;
    }
    .private-row.disabled { opacity: .55; cursor: default; }
    .private-box {
      width: 18px;
      height: 18px;
      display: grid;
      flex: none;
      place-items: center;
      border: 1px solid rgba(0, 0, 0, .28);
      border-radius: 4px;
      background: #fff;
    }
    .private-row.checked:not(.disabled) .private-box { border-color: var(--accent); background: var(--accent); }
    .private-check { width: 9px; height: 6px; border: solid #fff; border-width: 0 0 1.7px 1.7px; transform: translateY(-1px) rotate(-45deg); }
    .private-label { font-size: 13.5px; }
    .private-note { color: rgba(0, 0, 0, .45); font-size: 12px; }
    .local-summary { color: var(--text); font-size: 13px; font-weight: 500; }
    .empty-state { padding-top: 30px; color: var(--muted); }

    .footer {
      min-height: 44px;
      flex: 0 0 44px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px 0 14px;
      background: var(--footer);
      border-top: 1px solid var(--border);
    }
    .order-note { flex: 1; color: rgba(0, 0, 0, .5); font-size: 12px; }
    .save-state { min-width: 44px; color: var(--faint); font-size: 12px; text-align: right; }
    .save-state.error { color: #c5221f; }
    .footer-button {
      height: var(--control-height);
      padding: 0 12px;
      border: 1px solid rgba(0, 0, 0, .16);
      border-radius: 6px;
      background: linear-gradient(#fff, #f4f4f4);
      box-shadow: 0 1px 1px rgba(0, 0, 0, .06);
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
    }
    .footer-button:hover { background: #fff; }
    .footer-button.primary { color: #fff; border-color: #0860d8; background: var(--accent); }
    .footer-button.primary:hover { background: var(--accent-hover); }
  </style>
</head>
<body>
  <div class="app">
    <header class="titlebar">
      <div class="traffic-lights" aria-label="Window controls">
        <button class="traffic-light close" type="button" data-action="window-close" aria-label="Close window"></button>
        <button class="traffic-light minimize" type="button" data-action="window-minimize" aria-label="Minimize window"></button>
        <button class="traffic-light zoom" type="button" data-action="window-zoom" aria-label="Zoom window"></button>
      </div>
      <div class="titlebar-title">LinkRouter</div>
    </header>
    <main class="workspace">
      <aside class="sidebar" aria-label="Routing rules">
        <div id="rule-list" class="rule-list" role="list"></div>
        <div class="sidebar-actions">
          <button class="add-rule" type="button" data-action="add-rule"><span aria-hidden="true">＋</span> Add rule</button>
          <div class="rule-actions">
            <button id="remove-rule" class="icon-button" type="button" data-action="remove-rule" title="Remove selected rule" aria-label="Remove selected rule">−</button>
            <button id="move-up" class="icon-button" type="button" data-action="move-up" title="Move selected rule up" aria-label="Move selected rule up">↑</button>
            <button id="move-down" class="icon-button" type="button" data-action="move-down" title="Move selected rule down" aria-label="Move selected rule down">↓</button>
          </div>
        </div>
        <div class="everything-else">
          <div class="eyebrow">Everything else</div>
          <div id="special-routes"></div>
        </div>
      </aside>
      <section class="detail" aria-live="polite"><div id="editor" class="editor"></div></section>
    </main>
    <footer class="footer">
      <div id="order-note" class="order-note"></div>
      <div id="save-state" class="save-state">Loaded</div>
      <button class="footer-button" type="button" data-action="open-json">Open JSON</button>
      <button class="footer-button" type="button" data-action="reload">Reload</button>
      <button class="footer-button primary" type="button" data-action="save">Save</button>
    </footer>
  </div>

  <script>
    (() => {
      "use strict";

      const SAFARI = "Safari";
      const CHROME = "Google Chrome";
      let config = { default: { app: SAFARI }, rules: [] };
      let saved = JSON.stringify(config);
      let selection = { kind: "fallback" };

      const byId = (id) => document.getElementById(id);
      const escapeHTML = (value) => String(value ?? "")
        .replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;").replaceAll("'", "&#039;");

      function normalizedTarget(target) {
        const app = target && target.app === CHROME ? CHROME : SAFARI;
        const result = { app };
        if (app === CHROME && target.profile) result.profile = String(target.profile);
        if (app === CHROME && target.private === true) result.private = true;
        return result;
      }

      function normalizedConfig(input) {
        const rules = Array.isArray(input && input.rules) ? input.rules.map((rule, index) => ({
          name: String(rule.name || `Rule ${index + 1}`),
          hosts: Array.isArray(rule.hosts) ? rule.hosts.map(String) : [],
          ...normalizedTarget(rule)
        })) : [];
        return { default: normalizedTarget(input && input.default), rules };
      }

      function destination(target, long = false) {
        const browser = target.app === CHROME ? (long ? CHROME : "Chrome") : SAFARI;
        return browser + (target.app === CHROME && target.private ? " · private" : "");
      }

      function fallbackSummary() {
        if (config.default.app === SAFARI) return SAFARI;
        return `${CHROME} · ${config.default.profile || "Default"}${config.default.private ? " · private" : ""}`;
      }

      function isSelected(kind, index) {
        return selection.kind === kind && (kind !== "rule" || selection.index === index);
      }

      function sidebarRow({ kind, index, name, summary, label }) {
        const selected = isSelected(kind, index);
        const indexAttribute = kind === "rule" ? ` data-index="${index}"` : "";
        return `<button class="sidebar-row${selected ? " selected" : ""}" type="button" data-action="select" data-kind="${kind}"${indexAttribute} aria-current="${selected ? "page" : "false"}" aria-label="${escapeHTML(label)}">
          <span class="row-name">${escapeHTML(name)}</span><span class="row-destination">${escapeHTML(summary)}</span>
        </button>`;
      }

      function renderSidebar() {
        byId("rule-list").innerHTML = config.rules.map((rule, index) => sidebarRow({
          kind: "rule", index, name: rule.name || "Untitled rule", summary: destination(rule),
          label: `${rule.name || "Untitled rule"}, opens in ${destination(rule, true)}`
        })).join("");
        byId("special-routes").innerHTML = sidebarRow({
          kind: "fallback", name: "Unmatched links", summary: destination(config.default),
          label: `Unmatched links, opens in ${destination(config.default, true)}`
        }) + sidebarRow({
          kind: "local", name: "Local files", summary: "follows above",
          label: "Local files, follows Unmatched links"
        });
        const ruleSelected = selection.kind === "rule";
        const index = ruleSelected ? selection.index : -1;
        byId("remove-rule").disabled = !ruleSelected;
        byId("move-up").disabled = !ruleSelected || index === 0;
        byId("move-down").disabled = !ruleSelected || index === config.rules.length - 1;
        byId("order-note").textContent = `${config.rules.length} ${config.rules.length === 1 ? "rule" : "rules"} · first match from the top wins`;
      }

      function segmented(name, labels, selectedIndex) {
        return `<div class="segmented" role="radiogroup" aria-label="${escapeHTML(name)}">${labels.map((label, index) =>
          `<button class="segment${index === selectedIndex ? " selected" : ""}" type="button" role="radio" aria-checked="${index === selectedIndex}" data-action="segment" data-group="${escapeHTML(name)}" data-value="${index}">${escapeHTML(label)}</button>`
        ).join("")}</div>`;
      }

      function privateControl(target) {
        const disabled = target.app === SAFARI;
        const checked = !disabled && target.private === true;
        return `<button class="private-row${checked ? " checked" : ""}${disabled ? " disabled" : ""}" type="button" role="checkbox" aria-checked="${checked}" aria-disabled="${disabled}" data-action="private" ${disabled ? "disabled" : ""}>
          <span class="private-box">${checked ? '<span class="private-check"></span>' : ""}</span>
          <span class="private-label">Private window</span>
          ${disabled ? '<span class="private-note">not available for Safari</span>' : ""}
        </button>`;
      }

      function destinationEditor(target) {
        const chrome = target.app === CHROME;
        return `<div>
          <div class="section-title">Open in</div>
          <div class="destination-row">
            ${segmented("browser", [SAFARI, CHROME], chrome ? 1 : 0)}
            ${chrome ? `<label class="profile-row"><span class="profile-label">profile</span><span class="input-shell profile-shell"><input class="text-input" data-field="profile" value="${escapeHTML(target.profile || "")}" placeholder="Default" aria-label="Chrome profile directory"></span></label>` : ""}
          </div>
          ${privateControl(target)}
        </div>`;
      }

      function domainRows(rule) {
        const hosts = rule.hosts.length ? rule.hosts : [""];
        return hosts.map((pattern, index) => {
          const subdomains = pattern.startsWith("*.");
          const host = subdomains ? pattern.slice(2) : pattern;
          return `<div class="domain-row" data-domain-index="${index}">
            <label class="input-shell domain-shell"><span class="prefix">${subdomains ? "*." : ""}</span><input class="text-input" data-field="domain" data-index="${index}" value="${escapeHTML(host)}" placeholder="example.com" aria-label="Domain ${index + 1}"></label>
            ${segmented(`domain-${index}`, ["Exact", "Subdomains too"], subdomains ? 1 : 0)}
            <button class="remove-domain" type="button" data-action="remove-domain" data-index="${index}" aria-label="Remove domain ${index + 1}">×</button>
          </div>`;
        }).join("");
      }

      function renderRule(rule) {
        return `<div class="editor-group">
          <div><input class="heading-input" data-field="name" value="${escapeHTML(rule.name)}" placeholder="Untitled rule" aria-label="Rule name"><div class="divider"></div></div>
          <div><div class="section-title">Domains</div><div class="domain-list">${domainRows(rule)}<button class="text-button" type="button" data-action="add-domain">+ Add domain</button></div></div>
          ${destinationEditor(rule)}
        </div>`;
      }

      function renderFallback() {
        return `<div class="editor-group">
          <div><h1 class="heading">Unmatched links</h1><div class="description">Any http or https link whose host matches no rule above.</div><div class="divider"></div></div>
          ${destinationEditor(config.default)}
        </div>`;
      }

      function renderLocalFiles() {
        return `<div class="editor-group">
          <div><h1 class="heading">Local files</h1><div class="description">file:// URLs and HTML documents opened from disk. They have no hostname, so no domain rule can match them.</div><div class="divider"></div></div>
          <div><div class="section-title">Open in</div><div class="local-summary">Same as Unmatched links → ${escapeHTML(fallbackSummary())}</div><button class="text-button" type="button" data-action="edit-fallback">Edit Unmatched Links</button></div>
        </div>`;
      }

      function renderEditor() {
        if (selection.kind === "rule") {
          const rule = config.rules[selection.index];
          byId("editor").innerHTML = rule ? renderRule(rule) : '<div class="empty-state">Select or add a rule.</div>';
        } else if (selection.kind === "local") {
          byId("editor").innerHTML = renderLocalFiles();
        } else {
          byId("editor").innerHTML = renderFallback();
        }
      }

      function renderAll() { renderSidebar(); renderEditor(); updateSaveState(); }
      function currentTarget() { return selection.kind === "rule" ? config.rules[selection.index] : config.default; }
      function markEdited() { updateSaveState(); }
      function updateSaveState(message, isError = false) {
        const label = byId("save-state");
        label.textContent = message || (JSON.stringify(config) === saved ? "Saved" : "Edited");
        label.classList.toggle("error", isError);
      }

      function post(action, extra = {}) {
        const handler = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.linkRouter;
        if (handler) handler.postMessage({ action, ...extra });
      }

      document.addEventListener("click", (event) => {
        const control = event.target.closest("[data-action]");
        if (!control || control.disabled) return;
        const action = control.dataset.action;
        if (action.startsWith("window-")) {
          post(action);
        } else if (action === "select") {
          selection = control.dataset.kind === "rule"
            ? { kind: "rule", index: Number(control.dataset.index) }
            : { kind: control.dataset.kind };
          renderAll();
        } else if (action === "add-rule") {
          config.rules.push({ name: "New Rule", hosts: ["example.com"], app: CHROME });
          selection = { kind: "rule", index: config.rules.length - 1 };
          renderAll();
          document.querySelector('[data-field="name"]')?.select();
        } else if (action === "remove-rule" && selection.kind === "rule") {
          config.rules.splice(selection.index, 1);
          if (config.rules.length) selection.index = Math.min(selection.index, config.rules.length - 1);
          else selection = { kind: "fallback" };
          renderAll();
        } else if ((action === "move-up" || action === "move-down") && selection.kind === "rule") {
          const offset = action === "move-up" ? -1 : 1;
          const destination = selection.index + offset;
          if (destination >= 0 && destination < config.rules.length) {
            [config.rules[selection.index], config.rules[destination]] = [config.rules[destination], config.rules[selection.index]];
            selection.index = destination;
            renderAll();
          }
        } else if (action === "add-domain" && selection.kind === "rule") {
          config.rules[selection.index].hosts.push("");
          renderEditor(); markEdited();
          document.querySelectorAll('[data-field="domain"]')[config.rules[selection.index].hosts.length - 1]?.focus();
        } else if (action === "remove-domain" && selection.kind === "rule") {
          const hosts = config.rules[selection.index].hosts;
          if (hosts.length <= 1) hosts[0] = ""; else hosts.splice(Number(control.dataset.index), 1);
          renderEditor(); markEdited();
        } else if (action === "segment") {
          const target = currentTarget();
          if (control.dataset.group === "browser") {
            target.app = Number(control.dataset.value) === 1 ? CHROME : SAFARI;
            if (target.app === SAFARI) { delete target.profile; delete target.private; }
          } else if (selection.kind === "rule") {
            const index = Number(control.dataset.group.slice("domain-".length));
            const host = config.rules[selection.index].hosts[index].replace(/^\*\./, "");
            config.rules[selection.index].hosts[index] = Number(control.dataset.value) === 1 && host ? `*.${host}` : host;
          }
          renderAll();
        } else if (action === "private") {
          const target = currentTarget();
          if (target.app === CHROME) target.private = !target.private;
          renderAll();
        } else if (action === "edit-fallback") {
          selection = { kind: "fallback" }; renderAll();
        } else if (action === "save") {
          post("save", { configuration: config });
        } else if (action === "reload") {
          post("reload");
        } else if (action === "open-json") {
          post("openJSON");
        }
      });

      document.addEventListener("input", (event) => {
        const field = event.target.dataset.field;
        const target = currentTarget();
        if (field === "name" && selection.kind === "rule") {
          target.name = event.target.value; renderSidebar();
        } else if (field === "profile" && target.app === CHROME) {
          target.profile = event.target.value;
        } else if (field === "domain" && selection.kind === "rule") {
          const index = Number(event.target.dataset.index);
          const subdomains = config.rules[selection.index].hosts[index].startsWith("*.");
          config.rules[selection.index].hosts[index] = subdomains && event.target.value ? `*.${event.target.value}` : event.target.value;
        }
        markEdited();
      });

      document.addEventListener("keydown", (event) => {
        if (!event.metaKey) return;
        if (event.key.toLowerCase() === "s") {
          event.preventDefault();
          post("save", { configuration: config });
        } else if (event.key.toLowerCase() === "r") {
          event.preventDefault();
          post("reload");
        }
      });

      window.LinkRouter = {
        setConfigurationFromBase64(value) {
          try {
            const bytes = Uint8Array.from(atob(value), character => character.charCodeAt(0));
            config = normalizedConfig(JSON.parse(new TextDecoder().decode(bytes)));
            saved = JSON.stringify(config);
            selection = config.rules.length ? { kind: "rule", index: 0 } : { kind: "fallback" };
            renderAll();
          } catch (error) {
            updateSaveState("Could not load settings", true);
          }
        },
        setStatus(message, isError = false) {
          if (!isError && message === "Saved") saved = JSON.stringify(config);
          updateSaveState(message, isError);
        }
      };

      renderAll();
      post("ready");
    })();
  </script>
</body>
</html>
